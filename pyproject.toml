[project]
name = "rag-backend"
version = "1.0.0"
description = "Document ingestion + conversational RAG backend (FastAPI, Qdrant, Redis, SQL) with LLM-driven interview booking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Devraj" }]
keywords = ["fastapi", "rag", "qdrant", "redis", "llm", "embeddings"]

dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # --- Config / validation ---
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    # --- Persistence (metadata) ---
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    # --- Vector store / cache ---
    "qdrant-client>=1.12.0",
    "redis>=5.0.0",
    # --- LLM orchestration (LangChain components; the RAG loop itself is custom) ---
    "langchain-core>=0.3.15",
    "langchain-text-splitters>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-qdrant>=0.2.0",
    # --- Document extraction ---
    "pypdf>=4.3.0",
]

# NOTE: no retry/backoff dependency is declared on purpose.  Transient-failure
# handling belongs to the SDK that owns the connection: ``langchain-openai``
# already retries chat + embedding calls (``max_retries``), ``redis`` applies
# ``socket_timeout``/``health_check_interval``, and the Qdrant client takes its
# own ``timeout``.  Wrapping them again would double the attempts without
# adding resilience.

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "asgi-lifespan>=2.1.0",
    "fakeredis>=2.24.0",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# NOTE: ``redis`` ships its own inline type hints (``redis/py.typed``), so the
# separate ``types-redis`` stub package is deliberately *not* a dependency — it
# lags the library and would shadow the authoritative types.

[project.urls]
Repository = "https://github.com/your-username/rag-backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
    "ASYNC",
    "S",   # bandit
]
ignore = [
    "S101",  # asserts are fine in tests
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "fakeredis.*",
    "tiktoken.*",
    "pypdf.*",
    # Optional extra: only installed when EMBEDDING_PROVIDER=sentence_transformers.
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
